<div class="col-md-8 offset-md-3">
  <form (ngSubmit)="onSubmit()">
    <h3>Delete Employee</h3>
    <label>Employee Id </label>
    <input
      type="text"
      class="form-control"
      id="employeeId"
      name="employeeId"
      [(ngModel)]="employeeId"
    />
    <button type="submit">Delete</button>
  </form>
</div>
