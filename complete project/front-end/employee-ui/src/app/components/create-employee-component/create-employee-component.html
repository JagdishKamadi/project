<form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
  <label>First Name: </label>
  <input
    type="text"
    placeholder="Enter firstname"
    id="firstname"
    formControlName="firstname"
  />
  <br />
  <br />

  <label>Last Name: </label>
  <input type="text" placeholder="Enter lastname" id="lastname" formControlName="lastname" />
  <br />
  <br />

  <label>Email: </label>
  <input type="email" placeholder="Enter email" id="email" formControlName="email" />
  <br />
  <br />

  <label>Age: </label>
  <input type="number" placeholder="Enter age" id="age" formControlName="age" />
  <br />
  <br />

  <button>Submit Form</button>
</form>
