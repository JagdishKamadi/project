<div class="col-md-8 offset-md-3">
  <form (ngSubmit)="onSubmit()">
    <h3>Employee Details</h3>

    <div class="form-group">
      <label for="firstName">First Name </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter first name"
        id="firstName"
        name="firstName"
        [(ngModel)]="employee.firstName"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="lastName">Last Name </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter last name"
        id="lastName"
        name="lastName"
        [(ngModel)]="employee.lastName"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="email">Email </label>
      <input
        type="email"
        class="form-control"
        placeholder="Enter email"
        id="email"
        name="email"
        [(ngModel)]="employee.email"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="age">Age </label>
      <input
        type="number"
        class="form-control"
        placeholder="Enter age"
        id="age"
        name="age"
        [(ngModel)]="employee.age"
      />
    </div>
    <br />

    <h3>Address Details</h3>

    <div class="form-group">
      <label for="houseNumber">House Number </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter house number"
        id="houseNumber"
        name="houseNumber"
        [(ngModel)]="employee.address.houseNumber"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="buildingName">Building Name </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter building name"
        id="buildingName"
        name="buildingName"
        [(ngModel)]="employee.address.buildingName"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="street">Street </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter street"
        id="street"
        name="street"
        [(ngModel)]="employee.address.street"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="landmark">Landmark </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter landmark"
        id="landmark"
        name="landmark"
        [(ngModel)]="employee.address.landmark"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="locality">Locality </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter locality"
        id="locality"
        name="locality"
        [(ngModel)]="employee.address.locality"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="village">Village </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter village"
        id="village"
        name="village"
        [(ngModel)]="employee.address.village"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="city">City </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter city"
        id="city"
        name="city"
        [(ngModel)]="employee.address.city"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="district">District </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter district"
        id="district"
        name="district"
        [(ngModel)]="employee.address.district"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="state">State </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter state"
        id="state"
        name="state"
        [(ngModel)]="employee.address.state"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="country">Country </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter country"
        id="country"
        name="country"
        [(ngModel)]="employee.address.country"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="pincode">Pincode </label>
      <input
        type="text"
        class="form-control"
        placeholder="Enter pincode"
        id="pincode"
        name="pincode"
        [(ngModel)]="employee.address.pincode"
      />
    </div>
    <br />

    <div class="form-group">
      <label for="addressType">Address Type </label>
      <select
        class="form-control"
        id="addressType"
        name="addressType"
        [(ngModel)]="employee.address.addressType"
      >
        <option value="">Select type</option>
        <option value="HOME">HOME</option>
        <option value="OFFICE">OFFICE</option>
        <option value="BILLING">BILLING</option>
        <option value="SHIPPING">SHIPPING</option>
      </select>
    </div>
    <br />

    <div>
      <button type="submit" class="btn btn-success">Submit Details</button>
    </div>
  </form>
</div>
